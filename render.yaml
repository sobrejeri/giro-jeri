services:
  - type: web
    name: giro-jeri-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run start --workspace=packages/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Domínio do app do turista. É a base do link de RETORNO do Checkout Pro:
      # o cliente paga na página do Mercado Pago e volta para
      # <TURISTA_URL>/checkout/processando?p=<id>. Apontando para o lugar
      # errado, ele paga e cai numa página que não existe.
      - key: TURISTA_URL
        value: https://turivabrasil.com
      - key: COOP_URL
        value: https://turivabrasil.com/operador
      - key: ADMIN_URL
        value: https://turivabrasil.com/admin
      # Geoapify Places (OpenStreetMap) — diretório automático em "Descubra a Vila".
      # Gere a chave grátis em https://myprojects.geoapify.com e cole aqui no Render.
      - key: GEOAPIFY_API_KEY
        sync: false
      # Google Maps (server-side) — autocomplete/detalhes de endereços nos
      # transfers via Places API (New). Habilite "Places API (New)" no projeto.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Web Push (notificações no aparelho). Gere as chaves com:
      #   npx web-push generate-vapid-keys
      # e cole os valores aqui no painel do Render. Sem elas, o app não pede
      # permissão nem envia notificação. VAPID_SUBJECT é um mailto de contato.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Mercado Pago — produção. Token em mercadopago.com.br > Suas integrações.
      # O código lê MP_ACCESS_TOKEN (services/mercadoPago.js).
      - key: MP_ACCESS_TOKEN
        sync: false
      # Assinatura secreta do webhook (Suas integrações > Webhooks > Assinatura secreta)
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      # ── Split / Marketplace ──
      # Para dividir pagamentos entre plataforma e cooperativa.
      # Crie um aplicativo tipo Marketplace em mercadopago.com.br > Suas integrações.
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      # URL da cooperativa para onde redirecionar após o OAuth do MP
      - key: MP_OAUTH_RETURN_URL
        sync: false
      # ── E-mails transacionais ──
      # Dois provedores possíveis. Com as DUAS definidas, o Brevo ganha — é o
      # que permite migrar ligando uma variável, sem janela sem e-mail. Para
      # voltar ao Resend, basta apagar BREVO_API_KEY.
      #
      # Brevo (preferido): chave em brevo.com > SMTP & API > API Keys.
      # O domínio do EMAIL_FROM precisa estar verificado lá, senão o Brevo
      # aceita a chamada e o e-mail não chega.
      - key: BREVO_API_KEY
        sync: false
      # Resend (herança): chave em resend.com.
      - key: RESEND_API_KEY
        sync: false
      # Remetente dos e-mails. Sem domínio verificado no Resend, use onboarding@resend.dev
      - key: EMAIL_FROM
        value: Turiva <onboarding@resend.dev>
