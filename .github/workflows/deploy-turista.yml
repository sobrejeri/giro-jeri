name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/giro-jeri-platform-GFBFR
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build turista
        run: npm run build --workspace=packages/turista
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}

      - name: Build cooperativa
        run: npm run build --workspace=packages/cooperativa
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build admin
        run: npm run build --workspace=packages/admin
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}

      - name: Merge builds
        run: |
          mkdir -p dist
          cp -r packages/turista/dist/. dist/
          mkdir -p dist/cooperativa
          cp -r packages/cooperativa/dist/. dist/cooperativa/
          mkdir -p dist/admin
          cp -r packages/admin/dist/. dist/admin/

      - name: Create SPA 404.html
        run: |
          cat > dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Giro Jeri</title></head>
          <script>
          (function(){
            var l = window.location;
            var p = l.pathname;
            sessionStorage.setItem('spa_redirect', p + l.search + l.hash);
            if      (p.indexOf('/admin')       !== -1) l.replace(l.protocol+'//'+l.host+'/giro-jeri/admin/');
            else if (p.indexOf('/cooperativa') !== -1) l.replace(l.protocol+'//'+l.host+'/giro-jeri/cooperativa/');
            else                                       l.replace(l.protocol+'//'+l.host+'/giro-jeri/');
          })();
          </script>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
