name: Deploy to GitHub Pages

# A fonte do GitHub Pages está como "GitHub Actions" (o actions/deploy-pages
# só tem sucesso nesse modo — comprovado pelos deploys verdes da GFBFR).
# O ambiente github-pages só autoriza a branch de produção (GFBFR); por isso
# a main falhava em ~2s no portão. Publicamos apenas a partir da GFBFR.
on:
  push:
    branches:
      - claude/giro-jeri-platform-GFBFR
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca duas publicações ao mesmo tempo; a mais nova cancela a anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # O domínio é público — o lugar dele é em Variables. Aceitar também um
      # Secret evita a falha mais chata daqui: `vars.` não enxerga o que foi
      # criado em Secrets, o deploy passa VERDE e publica os caminhos antigos.
      # O site abre em branco e nada no log diz o motivo.
      #
      # Precisa ser num PASSO, não no `env:` do job: com `environment:`
      # declarado, o env do job é avaliado ANTES de o ambiente ser resolvido, e
      # o GitHub recusa o workflow inteiro se ele citar `secrets` ali — falha na
      # largada, sem criar job nenhum e sem log de passo para explicar.
      - name: Resolve custom domain
        env:
          FROM_VAR:    ${{ vars.CUSTOM_DOMAIN }}
          FROM_SECRET: ${{ secrets.CUSTOM_DOMAIN }}
        run: |
          DOMINIO="${FROM_VAR:-$FROM_SECRET}"
          echo "CUSTOM_DOMAIN=$DOMINIO" >> "$GITHUB_ENV"
          if [ -n "$DOMINIO" ]; then echo "Domínio próprio ativo."
          else echo "Sem domínio próprio — publicando em /giro-jeri/."; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build turista
        run: npm run build --workspace=packages/turista
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}

      - name: Build operador
        run: npm run build --workspace=packages/operador
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build admin
        run: npm run build --workspace=packages/admin
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}

      - name: Merge builds
        run: |
          mkdir -p dist
          cp -r packages/turista/dist/. dist/
          mkdir -p dist/operador
          cp -r packages/operador/dist/. dist/operador/
          mkdir -p dist/admin
          cp -r packages/admin/dist/. dist/admin/

      # O 404 é o roteador do SPA no GitHub Pages: qualquer URL profunda cai
      # aqui, e ele devolve para a raiz do app certo guardando o destino.
      # A raiz vem da MESMA variável do build — se divergissem, o 404 mandaria
      # para um caminho que não existe mais e o link compartilhado morreria.
      - name: Create SPA 404.html
        env:
        run: |
          ROOT=""
          [ -z "$CUSTOM_DOMAIN" ] && ROOT="/giro-jeri"
          cat > dist/404.html << EOF
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Turiva</title></head>
          <script>
          (function(){
            var l = window.location;
            var p = l.pathname;
            sessionStorage.setItem('spa_redirect', p + l.search + l.hash);
            if      (p.indexOf('/admin')       !== -1) l.replace(l.protocol+'//'+l.host+'$ROOT/admin/');
            else if (p.indexOf('/operador') !== -1) l.replace(l.protocol+'//'+l.host+'$ROOT/operador/');
            else                                       l.replace(l.protocol+'//'+l.host+'$ROOT/');
          })();
          </script>
          </html>
          EOF

      # O CNAME precisa estar DENTRO do artefato: o Pages recria o arquivo a
      # cada publicação e, sem ele aqui, o domínio próprio é desconfigurado no
      # deploy seguinte — o site volta para o endereço github.io sozinho.
      - name: Publish CNAME
        run: |
          if [ -z "$CUSTOM_DOMAIN" ]; then
            echo "::warning::CUSTOM_DOMAIN vazio — publicando em /giro-jeri/. \
          Se o domínio próprio já está configurado, o site abrirá em branco: \
          crie CUSTOM_DOMAIN em Settings > Secrets and variables > Actions."
            exit 0
          fi
          echo "$CUSTOM_DOMAIN" > dist/CNAME
          echo "CNAME publicado: $CUSTOM_DOMAIN"
          # og:url é meta fixa no HTML e não segue a base do Vite.
          find dist -name '*.html' -exec \
            sed -i "s#https://sobrejeri.github.io/giro-jeri/#https://$CUSTOM_DOMAIN/#g" {} +

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
