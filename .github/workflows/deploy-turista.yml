name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/giro-jeri-platform-GFBFR
  workflow_dispatch:

# Fluxo oficial do Pages (actions/deploy-pages): publica o artefato direto
# do workflow, sem passar pelo publicador interno da branch gh-pages — que
# vinha falhando de forma intermitente com "Deployment failed, try again
# later" mesmo com o build verde.
permissions:
  contents: read
  pages: write
  id-token: write

# Nunca roda duas publicações ao mesmo tempo; a mais nova cancela a antiga.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build turista
        run: npm run build --workspace=packages/turista
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}

      - name: Build cooperativa
        run: npm run build --workspace=packages/cooperativa
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build admin
        run: npm run build --workspace=packages/admin
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}

      - name: Merge builds
        run: |
          mkdir -p dist
          cp -r packages/turista/dist/. dist/
          mkdir -p dist/cooperativa
          cp -r packages/cooperativa/dist/. dist/cooperativa/
          mkdir -p dist/admin
          cp -r packages/admin/dist/. dist/admin/

      - name: Create SPA 404.html
        run: |
          cat > dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Giro Jeri</title></head>
          <script>
          (function(){
            var l = window.location;
            var p = l.pathname;
            sessionStorage.setItem('spa_redirect', p + l.search + l.hash);
            if      (p.indexOf('/admin')       !== -1) l.replace(l.protocol+'//'+l.host+'/giro-jeri/admin/');
            else if (p.indexOf('/cooperativa') !== -1) l.replace(l.protocol+'//'+l.host+'/giro-jeri/cooperativa/');
            else                                       l.replace(l.protocol+'//'+l.host+'/giro-jeri/');
          })();
          </script>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
