name: Verify Turiva Lojinha preview
on:
  pull_request:
    branches:
      - claude/giro-jeri-platform-GFBFR
    paths:
      - 'packages/turista/**'
      - '.github/workflows/preview-lojinha-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-turista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Turiva tourist app
        run: npm run build --workspace=packages/turista
