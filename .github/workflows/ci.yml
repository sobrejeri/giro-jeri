name: CI

on:
  push:
    branches: [ main, develop, 'fix/go-live-*' ]
  pull_request:
    branches: [ main, 'claude/giro-jeri-platform-GFBFR' ]

jobs:
  lint:
    name: Lint & check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Check for syntax errors
        run: |
          node --check packages/api/src/index.js
          node --check packages/api/src/routes/admin.js
          node --check packages/api/src/lib/goLiveDiagnostics.js

      - name: Test go-live and company controls (no credentials required)
        run: |
          node --test \
            packages/api/test/goLiveDiagnostics.test.js \
            packages/api/test/empresaEquipe.test.js \
            packages/api/test/empresaVinculo.test.js \
            packages/api/test/empresaRepasses.test.js \
            packages/api/test/companyPayout.test.js \
            packages/api/test/relatorioEmpresa.test.js

      - name: Full API regression suite (mocked services)
        run: npm test --workspace=packages/api
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: chave-de-teste-invalida-sem-acesso
          SUPABASE_ANON_KEY: chave-de-teste-invalida-sem-acesso
