<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Giro Jeri</title>
    <script>
      (function () {
        var path = location.pathname;
        var dest;

        // Roteia para o app correto com base no prefixo do caminho
        if (path.startsWith('/giro-jeri/admin')) {
          dest = '/giro-jeri/admin/';
        } else if (path.startsWith('/giro-jeri/cooperativa')) {
          dest = '/giro-jeri/cooperativa/';
        } else {
          dest = '/giro-jeri/';
        }

        // Salva o caminho completo para restaurar após o redirecionamento
        sessionStorage.setItem('spa_redirect', path + location.search + location.hash);
        location.replace(dest);
      })();
    </script>
  </head>
  <body></body>
</html>
