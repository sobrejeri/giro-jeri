<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Giro Jeri</title>
    <script>
      (function () {
        var path = location.pathname;
        if (path.startsWith('/giro-jeri/admin')) {
          location.replace('/giro-jeri/admin/');
        } else if (path.startsWith('/giro-jeri/cooperativa')) {
          location.replace('/giro-jeri/cooperativa/');
        } else {
          location.replace('/giro-jeri/');
        }
      })();
    </script>
  </head>
  <body></body>
</html>
